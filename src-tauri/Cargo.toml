[package]
name = "fasten-classic"
version = "0.1.0"
description = "Your household finances, on your computer. No subscription."
authors = ["Fasten Classic Contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "fasten_classic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.2.5", features = [] }
tauri-plugin-dialog = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32.1", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4"] }

[dev-dependencies]
tempfile = "3.14"
